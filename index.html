<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      These tags are the pre-JavaScript fallback only. applyBrand() overwrites
      the title and description at runtime from src/config/brand.ts, so update
      the config rather than editing these by hand — and keep them in sync here
      for crawlers that don't execute JS.
    -->
    <title>תפריט</title>
    <meta name="description" content="התפריט שלנו" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="תפריט" />
    <meta property="og:description" content="התפריט שלנו" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="תפריט" />
    <meta name="twitter:description" content="התפריט שלנו" />
    <!--
      TODO: add og:image / twitter:image once the client supplies a share image.
      The previous URL pointed at the other client's Lovable preview render.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
