# Daily snapshot of the live menu into the repository.
#
# This exists because the Supabase project was deleted on 2026-10-15 and the
# free tier keeps no backups. The only reason the menu survived was an
# unrelated dump taken eleven days earlier. Git history is the version store:
# any past commit is a restorable snapshot.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon/publishable key, not the service_role key
#
# The anon key is enough: categories and dishes are publicly readable and the
# dish-images bucket is public, so CI never holds a privileged credential.

name: Backup menu

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily, off the hour to avoid the rush
  workflow_dispatch: # and on demand, e.g. before an Excel import

concurrency:
  group: backup-menu
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Snapshot menu and photos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/backup-menu.mjs

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain backups)" ]; then
            echo "menu unchanged since the last snapshot"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          dishes=$(node -e "console.log(require('./backups/menu-latest.json').dishes.length)")
          photos=$(ls backups/dish-images 2>/dev/null | wc -l | tr -d ' ')
          git commit -m "Menu snapshot: ${dishes} dishes, ${photos} photos"
          git push
